map $http_accept $want_portal {
    default 0;
    ~*text/html 1;
}

server {
    listen 48479 ssl;
    listen [::]:48479 ssl;
    server_name _;

    ssl_certificate     /root/cert/ip/89.149.118.186.crt;
    ssl_certificate_key /root/cert/ip/89.149.118.186.key;

    location = /go {
        alias /var/www/vpn-portal/index.html;
        default_type text/html;
    }
    location = /add {
        alias /var/www/vpn-portal/index.html;
        default_type text/html;
    }
    location = /qr.svg {
        alias /var/www/vpn-portal/qr.svg;
        default_type image/svg+xml;
    }

    # Any short subscription token
    location ~ "^/([A-Za-z0-9]{8,64})$" {
        set $sub_id $1;
        if ($want_portal = 1) {
            rewrite ^ /portal-index last;
        }
        proxy_pass https://127.0.0.1:40946/$sub_id;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }

    location = /portal-index {
        internal;
        alias /var/www/vpn-portal/index.html;
        default_type text/html;
    }

    location / {
        proxy_pass https://127.0.0.1:48480;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
